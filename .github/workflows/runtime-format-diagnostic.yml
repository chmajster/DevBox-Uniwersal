name: Runtime format diagnostic

on:
  push:
    branches:
      - agent/03-runtimes

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Print gofmt differences
        run: |
          files="$(gofmt -l backend)"
          if [ -n "$files" ]; then
            echo "UNFORMATTED_FILES_START"
            printf '%s\n' "$files"
            echo "UNFORMATTED_FILES_END"
            exit 1
          fi
