name: Agent gofmt

on:
  push:
    branches:
      - agent/11-database-connectivity
    paths:
      - .github/workflows/agent-gofmt.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/11-database-connectivity
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format Go sources
        run: |
          cd backend
          gofmt -w .
      - name: Commit formatting
        run: |
          if git diff --quiet -- backend; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "gofmt database connectivity changes"
          git push origin HEAD:agent/11-database-connectivity
