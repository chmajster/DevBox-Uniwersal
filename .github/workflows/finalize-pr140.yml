name: Apply reviewed PR 140 completion

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/pr140-transfer/**'
      - '.github/workflows/finalize-pr140.yml'

permissions:
  contents: write

concurrency:
  group: apply-reviewed-pr140
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.event.pull_request.number == 140 && github.event.pull_request.head.repo.full_name == 'chmajster/DevBox-Uniwersal' && github.event.pull_request.head.ref == 'agent/140-application-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/140-application-control-plane
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact locally tested patch and apply to index
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('.github/pr140-transfer').glob('*.b64'))
          assert [p.name for p in parts] == ['00.b64', '01.b64', '02.b64', '03.b64', '04.b64']
          encoded = ''.join(p.read_text() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
          assert len(patch) == 234339
          assert hashlib.sha256(patch).hexdigest() == 'a2f4d194b131f22395d3dfe43fcf38e84f17f3d4b7621f55ae09c0f68fc59aaa'
          pathlib.Path('/tmp/pr140-reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/pr140-reviewed.patch
          git apply --index /tmp/pr140-reviewed.patch
          git diff --cached --stat
      - name: Backend verification
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./cmd/...
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit only reviewed source changes to existing PR branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(applications): finish control plane UI, lifecycle safety and regression coverage'
          git push origin HEAD:refs/heads/agent/140-application-control-plane
          git rev-parse HEAD
