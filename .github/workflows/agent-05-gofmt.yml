name: Agent 05 gofmt

on:
  push:
    branches:
      - agent/05-databases

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[gofmt]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/05-databases
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format and commit
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Format database implementation [gofmt]"
            git push origin HEAD:agent/05-databases
          fi
