name: Foundation Bootstrap

on:
  push:
    branches:
      - agent/01-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[foundation materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/01-foundation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk*.b64 | base64 -d > /tmp/foundation.tar.gz
          tar -xzf /tmp/foundation.tar.gz -C .
          gofmt -w backend
          (
            cd backend
            go mod tidy
          )
          (
            cd frontend
            npm install --package-lock-only --ignore-scripts
          )
          rm -rf .bootstrap
          rm -f .github/workflows/foundation-bootstrap.yml

      - name: Commit foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish project foundation [foundation materialized]"
          git push origin HEAD:agent/01-foundation
