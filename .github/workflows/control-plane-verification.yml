name: Application control plane

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'migrations/**'
      - '.github/workflows/control-plane-verification.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Docker and Compose availability
        run: |
          docker info
          docker compose version
      - name: Application API, state, encryption and operation-lock regressions
        working-directory: backend
        run: go test -race ./internal/applications ./internal/drivers/... -count=1
      - name: Four real deployment drivers and persistent data safety
        working-directory: backend
        env:
          DEVBOX_TEST_APPLICATION_DOCKER: '1'
        run: go test ./internal/applications -run '^TestApplicationDockerLifecycle$' -v -count=1 -timeout=10m
