name: Workspace UI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/workspace-ui.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Brand asset integrity tests
        run: python -m unittest discover -s e2e -p 'test_branding_assets.py' -v
      - run: npm ci
      - run: npm run build
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Brand rendering regression tests (real PNG/ICO assets)
        run: python e2e/branding_smoke.py
      - name: Workspace smoke tests (synthetic API fixtures)
        run: python e2e/workspace_smoke.py
      - name: Upload UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-preview
          path: frontend/ui-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact tested bundle for reproducible inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-build
          path: |
            frontend/dist/
            frontend/e2e/
          if-no-files-found: warn
          retention-days: 7
